[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huoshaoyun-mambahsi"
version = "1.0.0"
description = "Reproducible MambaHSI workflow for Huoshaoyun EnMAP mineralization mapping"
readme = "README.md"
requires-python = ">=3.8,<3.9"
dependencies = [
  "numpy==1.24.3",
  "torch==2.2.2",
  "scikit-learn==1.3.2",
  "optuna==4.5.0",
  "mamba-ssm==1.1.3",
  "rasterio==1.3.11",
  "pandas>=1.5,<2.1",
  "geopandas>=0.12,<1.0",
  "PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
